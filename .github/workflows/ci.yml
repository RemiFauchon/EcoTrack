name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - name: Install
        working-directory: app/backend
        run: npm ci
      - name: Build
        working-directory: app/backend
        run: npm run build
      - name: Unit tests + coverage
        working-directory: app/backend
        run: npm run test:cov
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: app/coverage/
          if-no-files-found: ignore

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install
        working-directory: app/frontend
        run: npm ci
      - name: Type-check + build
        working-directory: app/frontend
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env for the stack
        working-directory: app
        run: cp .env.example .env

      - name: Start the full stack (Docker Compose)
        working-directory: app
        run: docker compose up -d --build

      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3000/health > /dev/null; then
              echo "API ready"; exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy in time"
          docker compose -f app/docker-compose.yml logs backend | tail -50
          exit 1

      - name: Wait for frontend to be reachable
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173 || echo "000")
            if [ "$code" = "200" ]; then echo "Frontend ready"; exit 0; fi
            sleep 5
          done
          echo "Frontend did not become reachable in time"; exit 1

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install Playwright + Chromium
        working-directory: app/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: app/e2e
        env:
          BASE_URL: http://localhost:5173
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/e2e/playwright-report/
          if-no-files-found: ignore

      - name: Dump container logs on failure
        if: failure()
        working-directory: app
        run: docker compose logs --tail=200
